# Gates de qualidade no Azure DevOps.
#
# Dois estágios de propósito: os gates rápidos rodam em segundos e reprovam o PR
# cedo; a mutação leva minutos e só roda se o resto passou. Rodar mutação junto
# com lint só faz o dev esperar para descobrir um erro de import.
#
# Referencie a partir do seu pipeline principal:
#
#   stages:
#     - template: .azuredevops/azure-pipelines-gates.yml
#       parameters: { versaoNode: '22.x' }

parameters:
  - name: versaoNode
    type: string
    default: '22.x'
  - name: rodarMutacao
    type: boolean
    default: true

stages:
  - stage: gates_rapidos
    displayName: Gates rápidos
    jobs:
      - job: estaticos
        displayName: Estáticos, arquitetura e testes
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: NodeTool@0
            displayName: Node ${{ parameters.versaoNode }}
            inputs:
              versionSpec: ${{ parameters.versaoNode }}

          - script: npm ci
            displayName: Instalar dependências

          # Cada gate é um passo próprio para o Azure DevOps mostrar qual
          # reprovou sem ninguém precisar abrir o log inteiro.
          # Primeiro de todos: é o único gate que pega requisito faltando.
          # Os outros olham o código, e código errado pelo motivo certo passa
          # em todos eles.
          - script: npm run contrato
            displayName: 'Contrato da tarefa: nenhuma pergunta em aberto'

          - script: npm run format:check
            displayName: 'Formatação canônica'
          - script: npm run typecheck
            displayName: Typecheck
          - script: npm run typecoverage
            displayName: 'Cobertura de tipos 100%'
          - script: npm run lint
            displayName: 'Lint: complexidade, tamanho, tipos, nomes, testes'
          - script: npm run arch
            displayName: 'Arquitetura: direção de dependência'
          - script: npm run estrutura
            displayName: 'Estrutura: nomes de arquivo e pasta'
          - script: npm run halstead
            displayName: 'Halstead: dificuldade por função'
          - script: npm run segredos
            displayName: 'Segredos no repositório'
          - script: npm run sem-atalho
            displayName: 'Sem atalho: nenhuma supressão nova'
          - script: npm run gates-intactos
            displayName: 'Gates intactos: nenhum limite afrouxado ou apagado'
          - script: npm run deadcode
            displayName: 'Código morto'
          - script: npm run duplication
            displayName: 'Código redundante'
          - script: npm test
            displayName: 'Testes e cobertura 100%'

          # Fora do laço local de propósito: depende de rede e do estado do
          # aviso público, então pode ficar vermelho sem ninguém ter mexido em
          # nada. Aqui é informação para agir, não portão para travar o PR.
          - script: npm run vulns
            displayName: 'Vulnerabilidades conhecidas nas dependências'
            continueOnError: true

          - task: PublishCodeCoverageResults@2
            displayName: Publicar cobertura
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage/lcov.info'

  - ${{ if eq(parameters.rodarMutacao, true) }}:
      - stage: mutacao
        displayName: Mutação
        dependsOn: gates_rapidos
        condition: succeeded()
        jobs:
          - job: stryker
            displayName: Stryker, zero sobrevivente
            timeoutInMinutes: 60
            pool:
              vmImage: ubuntu-latest
            steps:
              - task: NodeTool@0
                inputs:
                  versionSpec: ${{ parameters.versaoNode }}

              - script: npm ci
                displayName: Instalar dependências

              # O relatório incremental corta o tempo em PR seguinte; sem o
              # cache, cada execução refaz a suíte inteira.
              - task: Cache@2
                displayName: Cache do relatório incremental
                inputs:
                  key: 'stryker | "$(Agent.OS)" | package-lock.json'
                  path: reports

              - script: npm run mutation
                displayName: 'Mutação: zero sobrevivente'

              - task: PublishBuildArtifacts@1
                displayName: Publicar relatório de mutação
                condition: succeededOrFailed()
                inputs:
                  pathToPublish: reports/mutation
                  artifactName: mutacao
